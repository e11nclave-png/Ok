  const svgHidden = `

      passwordInput.value.trim() !== "" &&
      firstNameInput.value.trim() !== "" &&
      lastNameInput.value.trim() !== "" &&
      birthDateInput.value.trim() !== "" &&
      countrySelect.value.trim() !== "" &&
      stateSelect.value.trim() !== ""
    );
  }

  // Enable or disable Continue button based on inputs
  function updateContinueButton() {
    if (allFieldsFilled()) {
      // Enable the button: remove disabled style/class if present
      continueBtn.classList.remove("styles-module-scss-module__fIycEa__disabledButton");
      continueBtn.disabled = false;
    } else {
      // Disable the button: add disabled style/class
      if (!continueBtn.classList.contains("styles-module-scss-module__fIycEa__disabledButton")) {

  // country and state are <select>, listen to change
  countrySelect.addEventListener("change", updateContinueButton);
  stateSelect.addEventListener("change", updateContinueButton);

  // Initial button state
  updateContinueButton();

  // Password visibility toggle
  passwordToggleBtn.addEventListener("click", () => {

      passwordInput.type = "text";
      // Swap SVG to visible icon
      passwordIconSpan.innerHTML = svgVisible;

      passwordInput.type = "password";
      // Swap SVG back to hidden icon
      passwordIconSpan.innerHTML = svgHidden;

document.addEventListener('DOMContentLoaded', () => {
    const dateInput = document.querySelector('input[name="birthDate"]');
    const continueButton = document.querySelector('[data-testid="continue-button"]');
    const form = dateInput.closest('form') || continueButton.closest('form');

    // Remove the strict numeric-only pattern that causes the error popup
    if (dateInput) {
        dateInput.removeAttribute('pattern');
    }

    dateInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 8) value = value.slice(0, 8);

        let formattedValue = '';
        if (value.length > 0) {
            formattedValue = value.substring(0, 2);
            if (value.length > 2) {
                formattedValue += '/' + value.substring(2, 4);
            }
            if (value.length > 4) {
                formattedValue += '/' + value.substring(4, 8);
            }
        }
        e.target.value = formattedValue;
    });

    const handleRedirect = (e) => {
        e.preventDefault();
        window.location.href = 'terms_of_service.html';
    };

    if (form) {
        form.addEventListener('submit', handleRedirect);
    } else {
        continueButton.addEventListener('click', handleRedirect);
    }
});
